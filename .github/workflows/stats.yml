name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate stats
        run: |
          mkdir -p dist

          curl -L \
            "https://github-readme-stats.vercel.app/api?username=gbcosta&show_icons=true&include_all_commits=true" \
            -o dist/stats.svg

      - name: Push Stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git output

          cd output

          git checkout --orphan stats-output

          git rm -rf . 2>/dev/null || true

          cp ../dist/stats.svg .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats.svg
          git commit -m "chore: update GitHub stats" || exit 0

          git push --force origin stats-output
